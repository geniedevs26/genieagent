name: GenieAgent strict verification recheck

# Re-runs the offline authenticity verification over recorded leads and
# revokes stale or contradicted verifications. This workflow NEVER sends
# outreach: OUTREACH_SEND_ENABLED and AUTO_OUTREACH_ENABLED are forced off.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum leads to re-assess"
        required: false
        default: "500"

permissions:
  contents: write # only to commit the redacted dashboard snapshot

concurrency:
  group: genieagent-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify leads and refresh snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GENIE_ENV: github-actions
      OUTREACH_SEND_ENABLED: "false"
      AUTO_OUTREACH_ENABLED: "false"
      WHATSAPP_SEND_ENABLED: "false"

      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      GENIE_OWNER_EMAIL: ${{ secrets.GENIE_OWNER_EMAIL }}
      GENIE_VERIFICATION_MAX_AGE_DAYS: ${{ vars.GENIE_VERIFICATION_MAX_AGE_DAYS || '30' }}
      OUTREACH_LEGAL_BASIS: ${{ vars.OUTREACH_LEGAL_BASIS || 'legitimate_interest_b2b' }}
      SUPPRESSED_EMAILS: ${{ secrets.SUPPRESSED_EMAILS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        run: |
          python -m compileall -q genieagent scripts
          python -m unittest discover -s tests -t .

      - name: Re-verify leads (no sending)
        env:
          LIMIT: ${{ inputs.limit || '500' }}
        run: |
          python scripts/pipeline_verify.py --limit "$LIMIT" --summary-title "GenieAgent verification recheck"

      - name: Rebuild redacted dashboard snapshot
        run: python scripts/pipeline_report.py --summary-title "GenieAgent dashboard refresh"

      - name: Verify the dashboard snapshot contains no contact details
        run: |
          python - <<'PY'
          import json, re, sys
          with open("data/dashboard.json", encoding="utf-8") as handle:
              text = handle.read()
          full_emails = [email for email in re.findall(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", text) if "*" not in email]
          if full_emails:
              sys.exit("Refusing to publish: full email address found in dashboard.json")
          if re.search(r"\"phone(?:_business)?\"", text):
              sys.exit("Refusing to publish: phone field found in dashboard.json")
          print("Dashboard snapshot is privacy-safe.")
          PY

      - name: Commit redacted dashboard snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "No dashboard change to commit."
            exit 0
          fi
          git config user.name "GenieAgent Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json
          git commit -m "Update verification snapshot [skip ci]"
          git push
