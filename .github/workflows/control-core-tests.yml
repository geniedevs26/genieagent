name: Central automation controls tests

on:
  push:
    branches:
      - feature/control-core-integration
    paths:
      - 'supabase/migrations/20261107120000_add_central_automation_controls.sql'
      - 'scripts/automation_control.py'
      - 'tests/**'
      - '.github/workflows/control-core-tests.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261107120000_add_central_automation_controls.sql'
      - 'scripts/automation_control.py'
      - 'tests/**'
      - '.github/workflows/control-core-tests.yml'

permissions:
  contents: read

jobs:
  postgres-and-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genieagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d genieagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare minimal Supabase auth roles for isolated migration test
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d genieagent_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid
            language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          grant usage on schema auth to authenticated, service_role;
          grant execute on function auth.uid() to authenticated, service_role;
          grant select on auth.users to authenticated, service_role;
          SQL
      - name: Apply migration to isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d genieagent_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261107120000_add_central_automation_controls.sql
      - name: Verify defaults, owner isolation, updates and service-role access
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d genieagent_test -v ON_ERROR_STOP=1 -f tests/test_control_migration.sql
      - name: Run Python fail-closed unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/automation_control.py scripts/auto_outreach.py scripts/inbox_monitor.py scripts/execute_approved_actions.py
