name: Daily public lead research

on:
  push:
    paths:
      - 'scripts/lead_research.py'
      - 'scripts/sync_candidates_supabase.py'
      - 'scripts/auto_outreach.py'
      - '.github/workflows/daily-lead-research.yml'
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Keep generated lead records out of a public repository.
permissions:
  contents: read

concurrency:
  group: daily-public-lead-research
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover public business candidates
        run: python scripts/lead_research.py
      - name: Sync candidates to owner's private CRM when secrets are configured
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENIE_OWNER_EMAIL: ${{ secrets.GENIE_OWNER_EMAIL }}
        run: python scripts/sync_candidates_supabase.py
      - name: Send one initial email to newly confirmed leads when enabled
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENIE_OWNER_EMAIL: ${{ secrets.GENIE_OWNER_EMAIL }}
          AUTO_OUTREACH_ENABLED: ${{ secrets.AUTO_OUTREACH_ENABLED }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GENIE_SENDER_EMAIL: ${{ secrets.GENIE_SENDER_EMAIL }}
        run: python scripts/auto_outreach.py
      - name: Report safe research summary
        run: |
          python - <<'PY'
          import csv, os
          path = "data/research_candidates.csv"
          count = 0
          if os.path.exists(path):
              with open(path, newline="", encoding="utf-8-sig") as f:
                  count = sum(1 for row in csv.DictReader(f))
          summary = f"Research run completed. Candidate rows: {count}. Lead details are not committed to this public repository. Private CRM sync status is reported in the preceding step summary."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Lead research result\n\n" + summary + "\n")
          PY
