name: Daily public lead research

on:
  push:
    paths:
      - 'scripts/lead_research.py'
      - 'scripts/remote_job_research.py'
      - 'scripts/sync_candidates_supabase.py'
      - 'scripts/auto_outreach.py'
      - 'scripts/inbox_monitor.py'
      - 'scripts/execute_approved_actions.py'
      - 'scripts/check_security.py'
      - 'index.html'
      - 'functions/api/reddit-feed.js'
      - 'supabase/migrations/**'
      - '.github/workflows/daily-lead-research.yml'
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Keep generated lead records out of a public repository.
permissions:
  contents: read

concurrency:
  group: daily-public-lead-research
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run security and automation regression checks
        run: |
          python -m py_compile scripts/remote_job_research.py scripts/lead_research.py scripts/sync_candidates_supabase.py scripts/auto_outreach.py scripts/inbox_monitor.py scripts/execute_approved_actions.py scripts/check_security.py
          python scripts/check_security.py
      - name: Discover and verify public business requirements (persistent research cursor)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENIE_OWNER_EMAIL: ${{ secrets.GENIE_OWNER_EMAIL }}
        run: python scripts/lead_research.py
      - name: Sync candidates to owner's private CRM when secrets are configured
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENIE_OWNER_EMAIL: ${{ secrets.GENIE_OWNER_EMAIL }}
        run: python scripts/sync_candidates_supabase.py
      - name: Monitor replies, bounces and guarded AI email responses before any follow-up
        timeout-minutes: 10
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENIE_OWNER_EMAIL: ${{ secrets.GENIE_OWNER_EMAIL }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GENIE_SENDER_EMAIL: ${{ secrets.GENIE_SENDER_EMAIL }}
          CLOUDFLARE_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AI_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: python scripts/inbox_monitor.py
      - name: Send automatically qualified buyer inquiries and bounded follow-ups under owner's standing authorization
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENIE_OWNER_EMAIL: ${{ secrets.GENIE_OWNER_EMAIL }}
          AUTO_OUTREACH_ENABLED: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GENIE_SENDER_EMAIL: ${{ secrets.GENIE_SENDER_EMAIL }}
          SUPPRESSED_EMAILS: ${{ secrets.SUPPRESSED_EMAILS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: python scripts/auto_outreach.py
      - name: Execute only owner-approved client order stages
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENIE_OWNER_EMAIL: ${{ secrets.GENIE_OWNER_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GENIE_SENDER_EMAIL: ${{ secrets.GENIE_SENDER_EMAIL }}
        run: python scripts/execute_approved_actions.py
      - name: Report safe research summary
        run: |
          python - <<'PY'
          import csv, os
          path = "data/research_candidates.csv"
          count = 0
          if os.path.exists(path):
              with open(path, newline="", encoding="utf-8-sig") as f:
                  count = sum(1 for row in csv.DictReader(f))
          summary = f"Research run completed. Automatically qualified lead rows: {count}. Lead details are not committed to this public repository. Private CRM sync status is reported in the preceding step summary."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Lead research result\n\n" + summary + "\n")
          PY
