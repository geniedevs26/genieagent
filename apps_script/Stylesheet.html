<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f17;
    --panel: #141b26;
    --panel-2: #1a2331;
    --line: #26303f;
    --text: #e8eef6;
    --muted: #9aa8bb;
    --accent: #4f9cf9;
    --ok: #46c38a;
    --warn: #e0b050;
    --danger: #e06c6c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .app { display: flex; flex-direction: column; min-height: 100vh; padding: 14px 12px 20px; }

  .head { margin-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .mark {
    width: 10px; height: 10px; border-radius: 3px;
    background: linear-gradient(135deg, var(--accent), #8b7cf6);
    box-shadow: 0 0 10px rgba(79, 156, 249, 0.6);
  }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 12px; }

  .banner {
    margin: 0 0 10px; padding: 9px 10px; border-radius: 8px;
    border: 1px solid rgba(224, 108, 108, 0.45);
    background: rgba(224, 108, 108, 0.12); color: #f3c9c9; font-size: 12px;
  }
  .banner.ok { border-color: rgba(70, 195, 138, 0.4); background: rgba(70, 195, 138, 0.1); color: #b9ecd4; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .tab {
    appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; font-weight: 500; padding: 7px 8px 8px; cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .pill {
    display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--panel-2); color: var(--muted); font-size: 11px; font-weight: 600;
  }

  .view { flex: 1; }
  .hidden { display: none !important; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .muted { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .empty {
    padding: 22px 14px; text-align: center; color: var(--muted);
    border: 1px dashed var(--line); border-radius: 10px; font-size: 12px;
  }

  .card {
    border: 1px solid var(--line); border-radius: 10px;
    background: linear-gradient(180deg, var(--panel), var(--bg));
    padding: 10px 10px 11px;
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .company { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
  .lead-id { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }

  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .badge.email { color: #a8cfff; border-color: rgba(79, 156, 249, 0.4); }
  .badge.whatsapp { color: #a9e7c5; border-color: rgba(70, 195, 138, 0.4); }
  .badge.followup { color: #efd49b; border-color: rgba(224, 176, 80, 0.45); }

  .row { margin-top: 6px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .row b { color: var(--text); font-weight: 500; }
  .subject { margin-top: 7px; font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }

  details { margin-top: 7px; }
  summary {
    cursor: pointer; color: var(--accent); font-size: 11.5px; list-style: none;
    user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  pre.body {
    margin: 7px 0 0; padding: 8px 9px; border-radius: 8px; background: #0d1420;
    border: 1px solid var(--line); color: #d7e2ef; font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto;
  }

  ul.warn { margin: 7px 0 0; padding: 0 0 0 15px; color: var(--warn); font-size: 11px; }
  ul.warn li { margin-bottom: 2px; }

  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .actions .primary { flex: 1; }
  .actions .danger { flex: 0 0 auto; }

  button {
    appearance: none; font: inherit; font-size: 12px; font-weight: 600;
    border-radius: 7px; padding: 7px 10px; cursor: pointer; border: 1px solid transparent;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .primary { background: var(--accent); color: #04101f; }
  .primary:hover:not(:disabled) { background: #6aaeff; }
  .danger { background: transparent; color: var(--danger); border-color: rgba(224, 108, 108, 0.5); }
  .danger:hover:not(:disabled) { background: rgba(224, 108, 108, 0.12); }
  .ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .ghost:hover:not(:disabled) { color: var(--text); border-color: #3a4658; }

  .reject-box { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  input[type="text"], input[type="email"] {
    width: 100%; padding: 7px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: #0d1420; color: var(--text); font: inherit;
  }
  input:focus { outline: 2px solid rgba(79, 156, 249, 0.4); outline-offset: 1px; }

  .field { margin-bottom: 8px; }
  label { display: block; font-size: 11.5px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 11px; margin: 10px 0 12px; }
  code { background: var(--panel-2); border-radius: 4px; padding: 0 3px; font-size: 10.5px; }

  .facts { margin: 0 0 12px; border-top: 1px solid var(--line); }
  .facts div { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 11.5px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; text-align: right; overflow-wrap: anywhere; }

  .note {
    padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); font-size: 11px;
  }
  .note strong { color: var(--text); display: block; margin-bottom: 3px; }

  .toast {
    position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 9px 11px;
    border-radius: 8px; background: #1d2a3b; border: 1px solid #33425a; color: var(--text);
    font-size: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .toast.bad { background: #2c1a1d; border-color: #5c3034; color: #f3ccd0; }
  .toast.good { background: #12291f; border-color: #2b5a44; color: #c6efd9; }
</style>
